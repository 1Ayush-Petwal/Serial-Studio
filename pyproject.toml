[project]
name = "serial-studio"
version = "0.1.0"
description = "Public-domain mystery story to a 2-minute audio series"
authors = [
    { name = "Ayush Petwal", email = "154801147+1Ayush-Petwal@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.6.1",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
serial-studio = "serial_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["serial_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# LangGraph 1.2 add_node overloads reject pydantic-state nodes under mypy (fails on a 5-line repro).
[[tool.mypy.overrides]]
module = "serial_studio.graph"
disable_error_code = ["call-overload"]
