# Local Postgres + pgvector for tests and local runs. Hosted runs use Supabase.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: serial
      POSTGRES_PASSWORD: serial
      POSTGRES_DB: serial
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
